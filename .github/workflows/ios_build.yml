name: iOS Unsigned IPA Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required by some Flutter tooling / Gradle) ───────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Set up Flutter (stable channel) ──────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 5. Build unsigned iOS release ────────────────────────────────────────
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # ── 6. Package Runner.app → Payload/ → Runner.ipa ────────────────────────
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Runner.ipa Payload
          echo "IPA created: $(ls -lh Runner.ipa)"

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsm_nav_app
          path: Runner.ipa
          retention-days: 30
